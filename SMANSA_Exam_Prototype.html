<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMANSA Exam</title>
<style>
body{font-family:Arial,sans-serif;background:#eef2f7;margin:0;color:#172033}
header{background:#172554;color:#fff;padding:16px 20px;display:flex;justify-content:space-between;font-weight:700}
main{max-width:760px;margin:35px auto;padding:15px}
.card{background:white;padding:25px;border-radius:16px;box-shadow:0 8px 25px #0001}
input{width:100%;padding:14px;border:1px solid #bbb;border-radius:9px;font-size:16px;box-sizing:border-box;margin-top:8px}
button{border:0;border-radius:9px;padding:13px 18px;font-weight:bold;font-size:15px;cursor:pointer}
.primary{background:#2563eb;color:white;width:100%;margin-top:15px}
.secondary{background:#e2e8f0}
.danger{background:#b91c1c;color:white;width:100%;margin-top:10px}
.hidden{display:none}.question{font-size:22px;font-weight:bold;line-height:1.4;margin:20px 0}
.progress{height:8px;background:#ddd;border-radius:10px;margin:15px 0}.bar{height:100%;background:#2563eb;border-radius:10px}
.score{text-align:center;font-size:52px;font-weight:bold;color:#2563eb}
.correct{color:#15803d;font-weight:bold}.wrong{color:#b91c1c;font-weight:bold}
.row{padding:14px 0;border-bottom:1px solid #ddd}
</style>
</head>
<body>
<header><span>SMANSA EXAM</span><span id="timer">10:00</span></header>

<main>
<div id="login" class="card">
<h1>Ujian Online</h1>
<p>Masukkan nama peserta untuk mulai.</p>
<input id="name" type="text" placeholder="Nama peserta">
<button id="start" class="primary">Mulai Ujian</button>
</div>

<div id="exam" class="card hidden">
<p id="candidate"></p>
<div class="progress"><div id="bar" class="bar" style="width:25%"></div></div>
<small id="number"></small>
<div id="question" class="question"></div>
<input id="answer" type="text" placeholder="Ketik jawaban...">
<div style="display:flex;gap:10px;margin-top:12px">
<button id="prev" class="secondary">← Sebelumnya</button>
<button id="next" class="primary" style="margin:0">Berikutnya →</button>
</div>
<button id="submit" class="danger">Kumpulkan Ujian</button>
</div>

<div id="result" class="card hidden">
<h1>Ujian Terkumpul ✅</h1>
<div id="score" class="score"></div>
<p id="summary"></p>
<hr>
<div id="review"></div>
<button class="primary" onclick="location.reload()">Ulangi</button>
</div>
</main>

<script>
(function(){
const questions=[
["Siapa ketua OSIS SMANSA Bireuen?","M.ABEL HAKEEM"],
["Tuliskan nama sekolah dari singkatan SMANSA Bireuen.","SMA NEGERI 1 BIREUEN"],
["Apa kepanjangan dari OSIS?","ORGANISASI SISWA INTRA SEKOLAH"],
["Berapa jumlah soal dalam prototype ini?","4"]
];

let current=0, answers=new Array(questions.length).fill(""), seconds=600;
let started=false, submitted=false, interval=null;

function $(id){return document.getElementById(id)}
function normalize(s){return String(s).trim().replace(/\s+/g," ").toUpperCase().replace(/[.,]/g,"")}

$("start").onclick=function(){
  const name=$("name").value.trim();
  if(!name){alert("Masukkan nama dulu.");$("name").focus();return}
  started=true;
  $("candidate").textContent="Peserta: "+name;
  $("login").classList.add("hidden");
  $("exam").classList.remove("hidden");
  render();
  interval=setInterval(function(){
    seconds--;
    const m=Math.floor(seconds/60), s=String(seconds%60).padStart(2,"0");
    $("timer").textContent=m+":"+s;
    if(seconds<=0)finish("waktu habis");
  },1000);
};

function render(){
  $("number").textContent="Soal "+(current+1)+" dari "+questions.length;
  $("question").textContent=questions[current][0];
  $("answer").value=answers[current];
  $("bar").style.width=((current+1)/questions.length*100)+"%";
  $("prev").disabled=current===0;
  $("next").textContent=current===questions.length-1?"Selesai →":"Berikutnya →";
}

$("answer").oninput=function(){answers[current]=this.value};

$("prev").onclick=function(){
  answers[current]=$("answer").value;
  if(current>0){current--;render()}
};

$("next").onclick=function(){
  answers[current]=$("answer").value;
  if(current<questions.length-1){current++;render()}
  else finish("selesai");
};

$("submit").onclick=function(){finish("dikumpulkan manual")};

function finish(reason){
  if(submitted)return;
  submitted=true;
  answers[current]=$("answer").value;
  if(interval)clearInterval(interval);
  let correct=0;
  questions.forEach(function(q,i){
    if(normalize(answers[i])===normalize(q[1]))correct++;
  });
  const score=Math.round(correct/questions.length*100);
  $("exam").classList.add("hidden");
  $("result").classList.remove("hidden");
  $("timer").textContent="SELESAI";
  $("score").textContent=score+"/100";
  $("summary").textContent=correct+" dari "+questions.length+" jawaban benar • "+reason;

  $("review").innerHTML=questions.map(function(q,i){
    const ok=normalize(answers[i])===normalize(q[1]);
    return '<div class="row"><b>'+(i+1)+". "+q[0]+"</b><br>"+
      'Jawaban kamu: <span class="'+(ok?"correct":"wrong")+'">'+
      (answers[i]||"(kosong)")+"</span>"+
      (ok?"":"<br>Jawaban benar: <span class=\"correct\">"+q[1]+"</span>")+
      "</div>";
  }).join("");
}

/* Jangan auto-submit hanya karena halaman kehilangan fokus sebentar.
   Untuk prototype ini, pindah tab benar-benar dianggap meninggalkan ujian. */
document.addEventListener("visibilitychange",function(){
  if(document.visibilityState==="hidden" && started && !submitted){
    finish("meninggalkan tab");
  }
});
})();
</script>
</body>
</html>
